name: veridia_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Fijadas a propósito: sin restricción, un `pub upgrade` podía traer una
  # major nueva de Firebase y romper la app sin que nadie tocara el código.
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  # Llama a las Cloud Functions en functions/ (identificarEspecie,
  # guardarObservacion): ahí vive la clave de Gemini y la transacción que
  # otorga Veridiums, fuera del alcance de un cliente modificado.
  # SIN USAR por ahora (2026-08-26): el proyecto no tiene el plan Blaze
  # activo, así que esas Cloud Functions no se pueden desplegar todavía y la
  # app llama a Gemini/Firestore directo mientras tanto. Se deja declarada
  # para no tener que resolverla otra vez cuando se reactive ese camino.
  cloud_functions: ^6.1.0
  # Sin firebase_storage a propósito: las fotos van a Supabase Storage
  # (ver lib/services/foto_service.dart). Firebase Storage no está
  # aprovisionado en el proyecto y exigiría plan Blaze.

  image_picker: ^1.1.2
  google_sign_in: ^6.1.0
  google_sign_in_web: ^0.12.4
  flutter_svg: ^2.0.10

  supabase_flutter: ^2.3.1

  http: ^1.1.2
  # sha256 para la huella exacta de cada foto (anti-repetición en desafíos).
  crypto: ^3.0.6
  # Lee los metadatos EXIF de la foto (GPS y fecha de captura) para guardar
  # DÓNDE se tomó y no dónde estaba el celular al subirla.
  exif: ^3.3.0
  flutter_image_compress: ^2.0.2
  shared_preferences: ^2.0.0
  app_settings: ^4.1.1
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  geolocator: 14.0.3
  permission_handler: 12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-400.ttf
          weight: 400
        - asset: assets/fonts/HankenGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/HankenGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/HankenGrotesk-700.ttf
          weight: 700
