name: veridia_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core:
  firebase_auth: 
  firebase_storage:
  cloud_firestore:

  image_picker: ^1.1.2
  google_sign_in: ^6.1.0
  google_sign_in_web: ^0.12.4
  flutter_svg: ^2.0.10

  supabase_flutter: ^2.3.1

  http: ^1.1.2
  flutter_image_compress: ^2.0.2
  shared_preferences: ^2.0.0
  app_settings: ^4.1.1
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  geolocator: 14.0.3
  permission_handler: 12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-400.ttf
          weight: 400
        - asset: assets/fonts/HankenGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/HankenGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/HankenGrotesk-700.ttf
          weight: 700
