# Memoria de Gradle, ajustada a la maquina que compila este proyecto.
#
# Antes pedia `-Xmx8G -XX:MaxMetaspaceSize=4G`: doce gigas de techo en un
# equipo que tiene SEIS en total. El build no fallaba de vez en cuando, no
# podia terminar: la JVM se quedaba sin memoria nativa a mitad de compilar
# Kotlin ("Native memory allocation (malloc) failed") y Gradle salia con
# codigo 1 tras once minutos, sin un solo error de codigo que mirar.
#
# 2G de heap sobran para este proyecto y dejan sitio al demonio de Kotlin,
# que corre en su propia JVM aparte. Si algun dia se compila en un equipo
# mas grande se puede subir, pero nunca por encima de la mitad de la RAM
# fisica: el resto lo necesitan el demonio de Kotlin, el de Gradle y el
# sistema.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# El demonio de Kotlin hereda su memoria de aqui; sin esto se queda con el
# valor por defecto y vuelve a competir por lo que no hay.
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
